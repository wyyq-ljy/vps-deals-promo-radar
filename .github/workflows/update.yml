name: Update verified VPS pricing
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vps-offer-updater
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Scrape official pages
        run: python scraper.py
      - name: Build
        run: python build.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Commit only changed data
        run: |
          if ! git diff --quiet -- data/offers.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/offers.json
            git commit -m 'chore: refresh verified provider data'
            git push
          fi